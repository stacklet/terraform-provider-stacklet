name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  Lint:
    permissions:
      contents: read
    uses: stacklet/github-tooling/.github/workflows/run-script.yml@1bb29247681da66913f0b04ab3845f6f9367ef0a # main
    secrets:
      STEP_SECURITY_API_KEY: ${{ secrets.STEP_SECURITY_API_KEY }}
    with:
      pre-commit-cache: true
      github-token: true
      full-git-history: true  # copyright headers need it
      run: |
        just lint

  Tests:
    permissions:
      contents: read
    uses: stacklet/github-tooling/.github/workflows/run-script.yml@1bb29247681da66913f0b04ab3845f6f9367ef0a # main
    secrets:
      STEP_SECURITY_API_KEY: ${{ secrets.STEP_SECURITY_API_KEY }}
    with:
      run: |
        just test
